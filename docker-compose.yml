# Local development + runner integration tests only.
# The fallbacks below are deliberately obvious DEV-ONLY placeholders so `docker compose up`
# works out of the box. Override them in `.env` (see .env.example). Production values are
# set as Railway environment variables and never live in this file.
services:
  mysql:
    build: ./sql-runner/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devonly-root-password-not-secret}
      RUNNER_ADMIN_USER: ${RUNNER_ADMIN_USER:-qq_admin}
      RUNNER_ADMIN_PASSWORD: ${RUNNER_ADMIN_PASSWORD:-devonly-admin-password-not-secret}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Healthy only once the init script has created the admin account.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u$${RUNNER_ADMIN_USER} -p$${RUNNER_ADMIN_PASSWORD} -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 60

  sql-runner:
    build: ./sql-runner
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 4000
      RUNNER_SECRET: ${RUNNER_SECRET:-devonly-runner-secret-not-for-production}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      RUNNER_ADMIN_USER: ${RUNNER_ADMIN_USER:-qq_admin}
      RUNNER_ADMIN_PASSWORD: ${RUNNER_ADMIN_PASSWORD:-devonly-admin-password-not-secret}
    ports:
      - "127.0.0.1:4000:4000"

volumes:
  mysql-data:
